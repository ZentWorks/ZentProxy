openapi: 3.1.0
info:
  title: ZentProxy API
  version: 0.7.12
  description: Versioned API for ZentProxy proxy management, certificates, routing, analytics, trusted proxies, integrations, user preferences and migration tooling.
servers:
  - url: /api/v1
tags:
  - name: System
    description: System information and administrator preferences.
  - name: Proxy Hosts
    description: HTTP and HTTPS reverse proxy hosts.
  - name: Certificates
    description: Certificate import, issuance and renewal.
  - name: Access Lists
    description: Reusable IP and Basic Authentication policies.
  - name: Routing
    description: Redirect hosts, 404 hosts and TCP/UDP streams.
  - name: Analytics
    description: Per-host traffic summaries and recent requests.
  - name: Trusted Proxies
    description: Trusted proxy and CDN networks used to recover the original client IP.
  - name: ZentLoop
    description: ZentLoop integration status, lists and routing rules.
  - name: Audit
    description: Administrative change history.
  - name: Migration
    description: Analyze and import supported Nginx Proxy Manager configuration.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ZentProxy API key
    sessionCookie:
      type: apiKey
      in: cookie
      name: zp_session
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        status: { type: integer }
    CustomLocation:
      type: object
      required: [path, scheme, forward_host, forward_port]
      properties:
        path: { type: string }
        scheme: { type: string, enum: [http, https] }
        forward_host: { type: string }
        forward_port: { type: integer, minimum: 1, maximum: 65535 }
        forward_path: { type: string }
        advanced_config: { type: string }
    HostInput:
      type: object
      required: [name, domains, scheme, forward_host, forward_port, enabled, websockets, preserve_host, statistics_enabled, store_query_string, block_common_exploits]
      properties:
        name: { type: string }
        domains:
          type: array
          items: { type: string, description: DNS name, wildcard DNS name or IP server name }
        scheme: { type: string, enum: [http, https] }
        forward_host: { type: string }
        forward_port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean }
        websockets: { type: boolean }
        preserve_host: { type: boolean }
        statistics_enabled: { type: boolean }
        store_query_string: { type: boolean, default: false }
        trusted_proxy_provider_id: { type: [integer, 'null'] }
        access_list_id: { type: [integer, 'null'] }
        block_common_exploits: { type: boolean }
        certificate_id: { type: [integer, 'null'] }
        ssl_forced: { type: boolean }
        http2_support: { type: boolean }
        hsts_enabled: { type: boolean }
        hsts_subdomains: { type: boolean }
        caching_enabled: { type: boolean }
        trust_forwarded_proto: { type: boolean }
        advanced_config: { type: string }
        custom_locations:
          type: array
          items: { $ref: '#/components/schemas/CustomLocation' }
    TrustedProxyProviderInput:
      type: object
      required: [name, header, cidrs]
      properties:
        name: { type: string, example: Office reverse proxy }
        header: { type: string, example: X-Forwarded-For, description: Header containing the original client IP }
        cidrs:
          type: array
          minItems: 1
          items: { type: string, description: IPv4/IPv6 address or CIDR }
          example: [10.0.0.10, 192.168.1.0/24]
    ZentLoopIPList:
      type: object
      required: [name, entries]
      properties:
        name: { type: string }
        entries: { type: array, items: { type: string, description: IPv4/IPv6 address or CIDR } }
    ZentLoopRule:
      type: object
      required: [name, enabled, match, value, action]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        match: { type: string, enum: [source_ip_list, path_exact, path_prefix] }
        value: { type: string }
        action: { type: string, enum: [zentloop, block] }
        host_ids: { type: array, items: { type: integer }, description: Empty means all proxy hosts }
    ZentLoopConfig:
      type: object
      required: [enabled, forward_unknown_hosts, upstream, ip_lists, rules]
      properties:
        enabled: { type: boolean }
        forward_unknown_hosts: { type: boolean, description: Forward hostnames outside automatically derived Proxy Host root domains to ZentLoop. Defaults to false. }
        upstream: { type: string }
        secret: { type: string }
        fallback: { type: string, enum: [block, '503'], description: Behavior when ZentLoop is unavailable }
        health: { $ref: '#/components/schemas/ZentLoopHealth' }
        ip_lists: { type: array, items: { $ref: '#/components/schemas/ZentLoopIPList' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ZentLoopRule' } }
    ZentLoopHealth:
      type: object
      properties:
        status: { type: string, enum: [disabled, online, degraded, offline, unknown] }
        reachable: { type: boolean }
        verified: { type: boolean }
        verification: { type: string }
        latency_ms: { type: integer }
        last_checked: { type: [string, 'null'], format: date-time }
        last_success: { type: [string, 'null'], format: date-time }
        error: { type: string }
    CertificateMetadataInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    CertificateInput:
      type: object
      required: [domains, challenge, auto_renew]
      properties:
        name: { type: string }
        domains: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        challenge: { type: string, enum: [http-01, dns-01] }
        email: { type: string, format: email, description: Optional; defaults to ZENTPROXY_ADMIN_EMAIL }
        dns_provider: { type: string, description: lego DNS provider code, required for DNS-01 }
        dns_credentials:
          type: object
          additionalProperties: { type: string }
          description: Environment variables required by the selected lego DNS provider. Stored in a mode-0600 file.
        auto_renew: { type: boolean, default: true }
    CertificateImportInput:
      type: object
      required: [name, provider, domains, certificate_pem, private_key_pem, auto_renew]
      properties:
        name: { type: string }
        provider: { type: string }
        domains: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        certificate_pem: { type: string }
        private_key_pem: { type: string }
        challenge: { type: string }
        email: { type: string }
        dns_provider: { type: string }
        dns_credentials: { type: object, additionalProperties: { type: string } }
        auto_renew: { type: boolean }
    AccessRule:
      type: object
      required: [address, directive]
      properties:
        address: { type: string, description: IP address or CIDR }
        directive: { type: string, enum: [allow, deny] }
    AccessListInput:
      type: object
      required: [name, satisfy_any, pass_auth, auth_enabled, rules]
      properties:
        name: { type: string }
        satisfy_any: { type: boolean }
        pass_auth: { type: boolean }
        auth_enabled: { type: boolean, description: Enable HTTP Basic Authentication when managed credentials exist }
        rules: { type: array, items: { $ref: '#/components/schemas/AccessRule' } }
    RedirectHostInput:
      type: object
      required: [domains, forward_http_code, forward_scheme, forward_domain_name, preserve_path, enabled]
      properties:
        domains: { type: array, items: { type: string } }
        forward_http_code: { type: integer, minimum: 300, maximum: 399 }
        forward_scheme: { type: string, enum: [auto, http, https] }
        forward_domain_name: { type: string }
        preserve_path: { type: boolean }
        certificate_id: { type: [integer, 'null'] }
        ssl_forced: { type: boolean }
        http2_support: { type: boolean }
        hsts_enabled: { type: boolean }
        hsts_subdomains: { type: boolean }
        block_exploits: { type: boolean }
        advanced_config: { type: string }
        enabled: { type: boolean }
    DeadHostInput:
      type: object
      required: [domains, enabled]
      properties:
        domains: { type: array, items: { type: string } }
        certificate_id: { type: [integer, 'null'] }
        ssl_forced: { type: boolean }
        http2_support: { type: boolean }
        hsts_enabled: { type: boolean }
        hsts_subdomains: { type: boolean }
        advanced_config: { type: string }
        enabled: { type: boolean }
    StreamInput:
      type: object
      required: [incoming_port, forward_host, forward_port, tcp_forwarding, udp_forwarding, enabled]
      properties:
        incoming_port: { type: integer, minimum: 1, maximum: 65535 }
        forward_host: { type: string }
        forward_port: { type: integer, minimum: 1, maximum: 65535 }
        tcp_forwarding: { type: boolean }
        udp_forwarding: { type: boolean }
        certificate_id: { type: [integer, 'null'] }
        enabled: { type: boolean }
    MigrationCredentials:
      type: object
      required: [base_url, identity, secret]
      properties:
        base_url: { type: string, format: uri }
        identity: { type: string }
        secret: { type: string, format: password }
        tls_skip_verify: { type: boolean, default: false }
    MigrationImportRequest:
      allOf:
        - $ref: '#/components/schemas/MigrationCredentials'
        - type: object
          properties:
            source_ids:
              type: array
              items: { type: integer }
              description: Optional proxy-host source IDs. Other supported routing objects are imported as part of the full migration.
security:
  - bearerAuth: []
paths:
  /user/preferences/language:
    put:
      tags: [System]
      summary: Set the current administrator UI language
      description: Interactive administrator session only. Supported languages are de, en, fr, nl and es.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [de, en, fr, nl, es] }
      responses:
        '200': { description: Language preference saved }
        '422': { description: Unsupported language }
  /user/preferences/proxy-hosts-view:
    put:
      tags: [System]
      summary: Set the current administrator Proxy Hosts view
      description: Interactive administrator session only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view]
              properties:
                view: { type: string, enum: [list, grouped] }
      responses:
        '200': { description: Proxy Hosts view preference saved }
        '422': { description: Unsupported view }
  /system/info:
    get:
      tags: [System]
      summary: Get system information
      responses: { '200': { description: OK } }
  /system/capabilities:
    get:
      tags: [System]
      summary: Discover API capabilities and available scopes
      responses: { '200': { description: OK } }
  /system/update:
    get:
      tags: [System]
      summary: Check whether a newer ZentProxy release is available
      description: Interactive administrator session only. Uses a server-side 12-hour cache and the latest stable GitHub release. GitHub failures do not affect the WebUI.
      responses: { '200': { description: Update status } }
  /hosts:
    get:
      tags: [Proxy Hosts]
      summary: List proxy hosts
      responses: { '200': { description: OK } }
    post:
      tags: [Proxy Hosts]
      summary: Create a proxy host
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostInput' } } }
      responses:
        '201': { description: Created }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hosts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Proxy Hosts]
      summary: Get a proxy host
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      tags: [Proxy Hosts]
      summary: Replace a proxy host
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostInput' } } }
      responses: { '200': { description: Updated } }
    delete:
      tags: [Proxy Hosts]
      summary: Delete a proxy host
      responses: { '200': { description: Deleted } }
  /certificates:
    get:
      tags: [Certificates]
      summary: List certificates and renewal state
      responses: { '200': { description: OK } }
  /certificates/letsencrypt:
    post:
      tags: [Certificates]
      summary: Issue a Let's Encrypt certificate using HTTP-01 or DNS-01
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CertificateInput' } } }
      responses: { '201': { description: Certificate issued }, '502': { description: ACME operation failed } }
  /certificates/import:
    post:
      tags: [Certificates]
      summary: Import an existing certificate and private key
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CertificateImportInput' } } }
      responses: { '201': { description: Certificate imported }, '422': { description: Invalid certificate material } }
  /certificates/{id}/renew:
    post:
      tags: [Certificates]
      summary: Renew a managed Let's Encrypt certificate immediately
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Renewed }, '502': { description: ACME operation failed } }
  /certificates/{id}:
    put:
      tags: [Certificates]
      summary: Update certificate display name and description
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CertificateMetadataInput' } } }
      responses: { '200': { description: Updated }, '404': { description: Not found } }
    delete:
      tags: [Certificates]
      summary: Delete an unassigned certificate
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '409': { description: Certificate is still assigned } }
  /access-lists:
    get:
      tags: [Access Lists]
      summary: List access lists
      responses: { '200': { description: OK } }
    post:
      tags: [Access Lists]
      summary: Create an IP-based access list
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessListInput' } } }
      responses: { '201': { description: Created } }
  /access-lists/{id}:
    get:
      tags: [Access Lists]
      summary: Get an access list
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      tags: [Access Lists]
      summary: Update a access list
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessListInput' } } }
      responses: { '200': { description: Updated }, '404': { description: Not found } }
    delete:
      tags: [Access Lists]
      summary: Delete a access list
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '409': { description: Still in use } }
  /access-lists/{id}/users:
    get:
      tags: [Access Lists]
      summary: List usernames configured for an access list
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Username list }, '404': { description: Access list not found } }
  /access-lists/{id}/users/{username}:
    put:
      tags: [Access Lists]
      summary: Create a credential or replace its password
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: username, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, writeOnly: true }
      responses: { '200': { description: Credential created or updated }, '404': { description: Access list not found } }
    delete:
      tags: [Access Lists]
      summary: Remove a credential from an access list
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: username, required: true, schema: { type: string } }
      responses: { '204': { description: Credential removed }, '404': { description: User or access list not found } }
  /redirect-hosts:
    get:
      tags: [Routing]
      summary: List redirect hosts
      responses: { '200': { description: OK } }
    post:
      tags: [Routing]
      summary: Create a redirect host
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RedirectHostInput' } } }
      responses: { '201': { description: Created } }
  /redirect-hosts/{id}:
    put:
      tags: [Routing]
      summary: Update a redirect host
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RedirectHostInput' } } }
      responses: { '200': { description: Updated }, '404': { description: Not found } }
    delete:
      tags: [Routing]
      summary: Delete a redirect host
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '409': { description: Still in use } }
  /dead-hosts:
    get:
      tags: [Routing]
      summary: List 404 hosts
      responses: { '200': { description: OK } }
    post:
      tags: [Routing]
      summary: Create a 404 host
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeadHostInput' } } }
      responses: { '201': { description: Created } }
  /dead-hosts/{id}:
    put:
      tags: [Routing]
      summary: Update a 404 host
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeadHostInput' } } }
      responses: { '200': { description: Updated }, '404': { description: Not found } }
    delete:
      tags: [Routing]
      summary: Delete a 404 host
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '409': { description: Still in use } }
  /streams:
    get:
      tags: [Routing]
      summary: List TCP/UDP streams
      responses: { '200': { description: OK } }
    post:
      tags: [Routing]
      summary: Create a TCP/UDP stream
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StreamInput' } } }
      responses: { '201': { description: Created } }
  /streams/{id}:
    put:
      tags: [Routing]
      summary: Update a stream
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StreamInput' } } }
      responses: { '200': { description: Updated }, '404': { description: Not found } }
    delete:
      tags: [Routing]
      summary: Delete a stream
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '409': { description: Still in use } }
  /stats/summary:
    get:
      tags: [Analytics]
      summary: Get aggregated request statistics
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h }
        - in: query
          name: host
          schema: { type: string }
        - in: query
          name: zentloop
          description: Filter analytics by requests routed through ZentLoop.
          schema: { type: string, enum: [only, without] }
      responses: { '200': { description: OK } }
  /stats/requests:
    get:
      tags: [Analytics]
      summary: Get recent requests
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h }
        - in: query
          name: host
          schema: { type: string }
        - in: query
          name: zentloop
          description: Filter analytics by requests routed through ZentLoop.
          schema: { type: string, enum: [only, without] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses: { '200': { description: OK } }
  /trusted-proxy-providers:
    get:
      tags: [Trusted Proxies]
      summary: List trusted proxy providers
      responses: { '200': { description: OK } }
    post:
      tags: [Trusted Proxies]
      summary: Create a custom trusted proxy provider
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrustedProxyProviderInput' } } }
      responses:
        '201': { description: Created }
        '422': { description: Validation error }
  /trusted-proxy-providers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    put:
      tags: [Trusted Proxies]
      summary: Update a custom trusted proxy provider
      description: Built-in providers such as Cloudflare cannot be edited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrustedProxyProviderInput' } } }
      responses:
        '200': { description: Updated }
        '409': { description: Built-in provider is immutable }
        '422': { description: Validation error }
    delete:
      tags: [Trusted Proxies]
      summary: Delete a custom trusted proxy provider
      description: Proxy Hosts using the deleted provider are automatically reset to Direct / None. Built-in providers cannot be deleted.
      responses:
        '200': { description: Deleted; response includes hosts_reset count }
        '409': { description: Built-in provider is immutable }
  /trusted-proxy-providers/{id}/refresh:
    post:
      tags: [Trusted Proxies]
      summary: Refresh an auto-updated trusted proxy provider
      description: Intended for built-in remote providers such as Cloudflare.
      responses: { '200': { description: Updated } }
  /integrations/zentloop:
    get:
      tags: [ZentLoop]
      summary: Get ZentLoop integration settings
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ZentLoopConfig' } } } } }
    put:
      tags: [ZentLoop]
      summary: Update ZentLoop integration settings and routing rules
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ZentLoopConfig' } } }
      responses: { '200': { description: Updated } }
  /integrations/zentloop/check:
    post:
      tags: [ZentLoop]
      summary: Run an immediate ZentLoop reachability and signature verification check
      responses:
        '200': { description: Current ZentLoop health, content: { application/json: { schema: { $ref: '#/components/schemas/ZentLoopHealth' } } } }
  /audit:
    get:
      tags: [Audit]
      summary: Get audit log
      responses: { '200': { description: OK } }
  /migration/analyze:
    post:
      tags: [Migration]
      summary: Analyze a running migration source without modifying it
      description: Interactive administrator session only. Credentials are used for this request and are not persisted. Read-only migration mounts can supply certificate/private-key and Basic-Auth material that the remote API cannot safely expose.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MigrationCredentials' } } }
      responses:
        '200': { description: Compatibility analysis }
        '502': { description: Source connection or analysis failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /migration/import:
    post:
      tags: [Migration]
      summary: Import the supported source routing configuration
      description: Interactive administrator session only. The source is re-read before import. Proxy hosts, certificates, access lists, redirects, 404 hosts and streams are converted to native ZentProxy objects; final proxy activation is rolled back on failure.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MigrationImportRequest' } } }
      responses:
        '201': { description: Migration completed }
        '422': { description: Source contains an object that cannot be migrated safely or nothing importable was selected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
